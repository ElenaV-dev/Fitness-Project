<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body { background-color: #f5f5f5; }
        .hero-section { background: white; border-radius: 20px; padding: 60px; }
        .main-description p { margin-bottom: 20px; line-height: 1.8; }
    </style>
</head>

<body>

<header class="bg-white shadow-sm sticky-top">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center py-3">
            <div class="fw-bold fs-2">Fitness</div>
            <div class="d-flex gap-2">
                <a th:href="@{/login}" class="btn btn-dark" th:text="#{main.login}">Личный кабинет</a>
                <a th:href="${#locale.language == 'en'} ? @{/(lang='ru')} : @{/(lang='en')}"
                   class="btn btn-outline-dark"
                   th:text="${#locale.language == 'en'} ? 'RU' : 'EN'">EN</a>
            </div>
        </div>
    </div>
</header>

<main class="container my-5">
    <div class="hero-section shadow-sm">
        <h1 class="display-4 fw-bold mb-4" th:text="#{main.title}">Добро пожаловать в Fitness</h1>

        <div class="main-description fs-5 text-secondary">
            <p th:text="#{main.subtitle}">Идеальное место для достижения ваших фитнес-целей!</p>
            <p th:text="#{main.general-text}">Огромный выбор тренировок...</p>

            <p class="mt-4">
                <strong th:text="#{main.address-label}">Адрес:</strong>
                <span th:text="#{main.address-value}">г. Темиртау, пр. Республики 105</span>
            </p>

            <div class="mt-4">
                <strong th:text="#{main.contacts-label}">Контакты:</strong>

                <div class="ms-4 mt-2" th:utext="#{main.contacts-value}">
                    8 (7213) 99-99-99<br>+7 701 987 65 32
                </div>
            </div>

            <p>
                <strong th:text="#{main.schedule-label}">Режим работы:</strong>
                <span th:text="#{main.schedule-value}">ежедневно 08:00 – 22:00</span>
            </p>
        </div>
    </div>
</main>

<footer class="bg-white border-top mt-5">
    <div class="container">
        <div class="text-center text-muted py-4">
            © 2026 Fitness. All rights reserved.
        </div>
    </div>
</footer >

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
