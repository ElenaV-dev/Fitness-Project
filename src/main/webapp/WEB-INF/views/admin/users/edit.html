<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Редактирование пользователя</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div th:replace="~{fragments/admin-header :: admin-menu}"></div>

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header"><h3>Редактировать пользователя</h3></div>

                <div class="card-body">

                    <form th:action="@{/admin/users/edit}"
                          th:object="${user}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Имя</label>
                            <input type="text"
                                   th:field="*{firstName}"
                                   class="form-control">
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('firstName')}"
                                 th:errors="*{firstName}">
                            </div>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">Фамилия</label>
                            <input type="text"
                                   th:field="*{lastName}"
                                   class="form-control">

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('lastName')}"
                                 th:errors="*{lastName}">
                            </div>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control">

                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">
                            </div>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password"
                                   th:field="*{password}"
                                   class="form-control">

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Роль
                            </label>

                            <select th:field="*{role}"
                                    class="form-select">

                                <option value="CLIENT">Клиент</option>
                                <option value="TRAINER">Тренер</option>
                                <option value="ADMIN">Администратор</option>

                            </select>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('role')}"
                                 th:errors="*{role}">
                            </div>

                        </div>

                        <button type="submit" class="btn btn-primary">Сохранить изменения</button>

                        <a th:href="@{/admin/users}" class="btn btn-secondary">Отмена</a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
