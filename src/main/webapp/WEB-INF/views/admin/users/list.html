<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Администрирование</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <div th:replace="~{fragments/admin-header :: admin-menu}"></div>

    <ul class="nav nav-tabs mb-4">

        <li class="nav-item">

            <a class="nav-link"
               th:classappend="${activeTab == 'workouts'} ? ' active'"
               th:href="@{/admin/workout-types}">

                Услуги

            </a>

        </li>

        <li class="nav-item">

            <a class="nav-link"
               th:classappend="${activeTab == 'users'} ? ' active'"
               th:href="@{/admin/users}">

                Пользователи

            </a>

        </li>

    </ul>

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h3>Пользователи</h3>

        <a th:href="@{/admin/users/create}" class="btn btn-success">Добавить пользователя</a>

    </div>

    <table class="table table-bordered table-hover bg-white">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Фамилия</th>
            <th>Email</th>
            <th>Роль</th>
            <th width="220">Действия</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="user : ${users}">

            <td th:text="${user.id}">1</td>

            <td th:text="${user.firstName}">Иван</td>

            <td th:text="${user.lastName}">Иванов</td>

            <td th:text="${user.email}">ivanov@mail.com</td>

            <td th:text="${user.role}">админ</td>

            <td>

                <a th:href="@{/admin/users/edit/{id}(id=${user.id})}"
                   class="btn btn-primary btn-sm">Изменить</a>

                <button type="button"
                        class="btn btn-danger btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#deleteModal"
                        th:data-url="@{/admin/users/delete/{id}(id=${user.id})}">
                    Удалить
                </button>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">Подтверждение удаления</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                Вы точно хотите удалить этого пользователя? Данное действие нельзя отменить.
            </div>
            <div class="modal-footer">

                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>

                <form id="deleteForm" method="post">
                    <button type="submit" class="btn btn-danger">Да, удалить</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const deleteModal = document.getElementById('deleteModal');
    if (deleteModal) {
        deleteModal.addEventListener('show.bs.modal', function (event) {

            const button = event.relatedTarget;

            const deleteUrl = button.getAttribute('data-url');

            const form = document.getElementById('deleteForm');
            form.action = deleteUrl;
        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
