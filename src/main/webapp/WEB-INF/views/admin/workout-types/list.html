<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Администрирование</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Fitness Admin</h2>

        <form th:action="@{/logout}" method="post">

            <button type="submit" class="btn btn-outline-dark">Выход</button>

        </form>

    </div>

    <ul class="nav nav-tabs mb-4">

        <li class="nav-item">
            <a class="nav-link active" th:href="@{/admin/workout-types}">Услуги</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/users}">Пользователи</a>
        </li>

    </ul>

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h3>Услуги</h3>

        <a th:href="@{/admin/workout-types/create}" class="btn btn-success">Добавить услугу</a>

    </div>

    <table class="table table-bordered table-hover bg-white">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Название</th>
            <th width="220">Действия</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="workoutType : ${workoutTypes}">

            <td th:text="${workoutType.id}">1</td>

            <td th:text="${workoutType.title}">Йога</td>

            <td>

                <a th:href="@{/admin/workout-types/edit/{id}(id=${workoutType.id})}"
                   class="btn btn-primary btn-sm">Изменить</a>

                <form th:action="@{/admin/workout-types/delete/{id}(id=${workoutType.id})}"
                      method="post"
                      style="display:inline">

                    <button type="submit" class="btn btn-danger btn-sm">Удалить</button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
