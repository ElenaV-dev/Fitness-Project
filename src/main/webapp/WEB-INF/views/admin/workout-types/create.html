<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.services.create.title-page}">Добавление услуги</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div th:replace="~{fragments/admin-header :: admin-menu}"></div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">

                <div class="card-header">
                    <h3 th:text="#{admin.services.create.header}">Добавить услугу</h3>
                </div>

                <div class="card-body">
                    <form th:action="@{/admin/workout-types/create}"
                          th:object="${workoutType}"
                          method="post"
                          class="needs-validation"
                          novalidate>

                        <div class="mb-3">
                            <label class="form-label" th:text="#{admin.services.create.label-title}">Название услуги</label>

                            <input type="text"
                                   id="title"
                                   th:field="*{title}"
                                   class="form-control"
                                   required
                                   maxlength="100"
                                   pattern="^[a-zA-Zа-яА-ЯёЁ\s-]+$">

                            <div class="invalid-feedback">Пожалуйста, введите корректное название (только буквы).</div>

                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('title')}"
                                 th:errors="*{title}">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success" th:text="#{admin.form.btn-save}">Сохранить</button>
                        <a th:href="@{/admin/workout-types}" class="btn btn-secondary" th:text="#{admin.form.btn-cancel}">Отмена</a>

                    </form>

                </div>

            </div>
        </div>
    </div>

</div>
<script>
    (function () {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()

    const titleInput = document.getElementById('title');
    if (titleInput) {
        titleInput.addEventListener('input', function() {
            this.value = this.value.replace(/[0-9!@#$%^&*()_+=\[\]{};':"\\|,.<>\/?`~]/g, '');
        });
    }
</script>
<script src="https://jsdelivr.net"></script>
</body>
</html>
