<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Страница клиента</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <div th:replace="~{fragments/account-header :: account-menu}"></div>

    <ul class="nav nav-tabs mb-4">

        <li class="nav-item">

            <a class="nav-link"
               th:classappend="${activeTab == 'workoutTypes'} ? 'active'"
               th:href="@{/account/workout-types}">Выбор тренировок</a>

        </li>

        <li class="nav-item">

            <a class="nav-link"
               th:classappend="${activeTab == 'trainingRecords'} ? 'active'"
               th:href="@{/account/training-records}">Ваши тренировки</a>

        </li>

    </ul>

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h3>Выбор тренировок</h3>

    </div>

    <table class="table table-bordered table-hover bg-white">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Название</th>
            <th width="220">Действия</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="workoutType : ${workoutTypes}">

            <td th:text="${workoutType.id}">1</td>

            <td th:text="${workoutType.title}">Бег</td>

            <td>

                <form th:action="@{/account/training-records/book/{id}(id=${workoutType.id})}"
                      method="post"
                      style="display:inline">

                    <button type="submit" class="btn btn-primary btn-sm">Записаться</button>

                </form>
            </td>

        </tr>

        </tbody>


    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
