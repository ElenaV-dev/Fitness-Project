<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.page-title}">Вход в систему</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">

    <style>
        body {
            background-color: #f5f5f5;
            min-height: 100vh;
        }
        .login-container {
            min-height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 20px;
            background: white;
            position: relative;
        }
    </style>
</head>

<body>

<div class="container login-container d-flex justify-content-center align-items-center">

    <div class="login-card shadow">

        <h2 class="text-center mb-4" th:text="#{login.header}">Вход в систему</h2>

        <div th:if="${param.logout}" class="alert alert-success py-2 text-center small" th:text="#{login.alert-logout}">
            Вы успешно вышли из системы
        </div>

        <form th:action="@{/login}" method="post" class="needs-validation" novalidate>

            <div class="mb-3">
                <label for="email" class="form-label" th:text="#{login.label-email}">Email</label>
                <input type="email" id="email" name="username" class="form-control" required>
                <div class="invalid-feedback">Пожалуйста, введите ваш Email.</div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label" th:text="#{login.label-password}">Пароль</label>
                <input type="password" id="password" name="password" class="form-control" required>
                <div class="invalid-feedback">Пожалуйста, введите пароль.</div>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-1 px-2 small mb-3 text-center" th:text="#{login.alert-error}">
                Неверный email или пароль
            </div>

            <button type="submit" class="btn btn-dark w-100" th:text="#{login.btn-submit}">
                Войти
            </button>

        </form>


        <hr>

        <div class="text-center">
            <p class="mb-2 text-muted small" th:text="#{login.text-no-account}">Еще нет аккаунта?</p>
            <a th:href="@{/registration}" class="btn btn-outline-dark" th:text="#{login.btn-register}">Зарегистрироваться</a>
        </div>

    </div>
</div>

<script>
    (function () {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>
</html>
